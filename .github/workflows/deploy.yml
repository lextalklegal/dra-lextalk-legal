name: Validate and deploy DRA Learning

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dra-learning-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DRA_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required deployment secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DRA_D1_DATABASE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret for $name. See docs/DEPLOYMENT_GUIDE_HINGLISH.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run project checks
        run: |
          npm run check
          npm run validate

      - name: Configure Cloudflare D1 ID
        run: python scripts/set_d1_database_id.py "$DRA_D1_DATABASE_ID"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply dra-lextalk-legal-db --remote

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
